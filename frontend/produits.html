<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produits - DAKARTECH</title>
  <meta name="description" content="Tous nos smartphones, ordinateurs et accessoires tech à Dakar">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="header"></div>

<!-- HERO MINI -->
<div style="background:linear-gradient(135deg,var(--dark),#0F3460);padding:32px 16px;text-align:center;color:#fff">
  <h1 style="font-size:1.8rem;font-weight:800;margin-bottom:8px">🛍️ Tous nos Produits</h1>
  <p style="color:#94A3B8">Téléphones, ordinateurs et accessoires tech de qualité</p>
</div>

<!-- CONTENU PRINCIPAL -->
<section class="section" style="padding-top:32px">
  <div class="container">

    <!-- BARRE DE FILTRES -->
    <div class="filters-bar">
      <!-- Recherche -->
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" id="recherche" placeholder="Rechercher un produit…">
      </div>

      <!-- Filtres catégorie -->
      <button class="filter-btn active" data-cat="">Tous</button>
      <button class="filter-btn" data-cat="telephones">📱 Téléphones</button>
      <button class="filter-btn" data-cat="ordinateurs">💻 Ordinateurs</button>
      <button class="filter-btn" data-cat="accessoires">🎧 Accessoires</button>
      <button class="filter-btn" data-cat="tablettes">📟 Tablettes</button>
      <button class="filter-btn" data-cat="montres">⌚ Montres</button>
    </div>

    <!-- FILTRES PRIX -->
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px;align-items:center">
      <span style="font-weight:600;font-size:0.9rem;color:var(--gray)">Prix (FCFA):</span>
      <input type="number" id="prix-min" placeholder="Min" class="form-control" style="width:130px;padding:8px 12px">
      <span style="color:var(--gray)">—</span>
      <input type="number" id="prix-max" placeholder="Max" class="form-control" style="width:130px;padding:8px 12px">
      <button class="btn btn-secondary btn-sm" onclick="resetFiltres()">Réinitialiser</button>
      <span id="total-produits" style="margin-left:auto;color:var(--gray);font-size:0.9rem"></span>
    </div>

    <!-- GRILLE PRODUITS -->
    <div class="products-grid" id="produits-grid">
      <div class="loading-overlay" style="grid-column:1/-1">
        <div class="loading-spinner"></div>
        <p>Chargement…</p>
      </div>
    </div>

    <!-- PAGINATION -->
    <div class="pagination" id="pagination"></div>
  </div>
</section>

<div id="footer"></div>

<script src="js/main.js"></script>
<script src="js/produits.js"></script>
</body>
</html>
